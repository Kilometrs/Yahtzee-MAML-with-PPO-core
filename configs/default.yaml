env:
  n_columns: 3
  seed: 42

agent:
  hidden_dim: 128
  n_layers: 2

ppo:
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  gae_lambda: 0.95
  n_epochs: 4
  batch_size: 64

meta:
  inner_lr: 0.01
  outer_lr: 0.0003
  n_inner_steps: 5
  n_tasks_per_batch: 3
  n_meta_steps: 10000

tasks:
  threshold_beater_score: 250

training:
  checkpoint_every: 500
  checkpoint_dir: checkpoints/
  device: cuda

clearml:
  project_name: yahtzee-maml
  task_name: default-run

env:
  n_columns: 1
  seed: 42
  max_steps_per_episode: 39

agent:
  hidden_dim: 600
  n_layers: 2
  use_layer_norm: true
  activation: swish
  dropout_rate: 0.1
  head_hidden_dim: 600

a2c:
  entropy_coef: 0.03
  value_loss_coef: 0.25
  gae_lambda: 0.0
  gamma: 1.0

meta:
  inner_lr: 0.01
  outer_lr: 0.0001
  n_inner_steps: 15
  n_tasks_per_batch: 6
  n_meta_steps: 50000
  n_parallel_envs: 100

tasks:
  threshold_beater_score: 200

training:
  checkpoint_every: 500
  eval_every: 1000
  n_eval_episodes: 200
  checkpoint_dir: /mnt/checkpoints/

clearml:
  project_name: yahtzee-maml-server-1col-a2c
  task_name: v2-aggressive-adaptation

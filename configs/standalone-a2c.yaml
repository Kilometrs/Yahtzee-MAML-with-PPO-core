env:
  n_columns: 1
  seed: 42
  max_steps_per_episode: 50    # 1-col game is ~39 steps; 50 gives one clean episode per env

agent:
  hidden_dim: 600
  n_layers: 2             # Paper: num_hidden-1 = 2 trunk blocks
  use_layer_norm: true
  activation: swish
  dropout_rate: 0.1
  head_hidden_dim: 600    # Paper: heads use same width as trunk
  norm_position: post     # Paper: Linear → Swish → LayerNorm → Dropout

a2c:
  gamma: 0.99
  gae_lambda: 0.0
  value_loss_coef: 0.005
  entropy_coef_roll: [0.1, 0.02]
  entropy_coef_score: [0.03, 0.01]
  entropy_hold: 0.3       # Paper Table 1 "Baseline" — hold max entropy for 30% of training
  entropy_anneal: 0.6     # Then anneal over 60%
  upper_regression_weight: 1.0
  upper_shaping_weight: 0.0    # disabled until upper head is trained

training:
  n_games: 5000000
  n_parallel_envs: 20
  lr: 0.0001
  lr_min_ratio: 0.05
  lr_warmup: 0.05
  lr_plateau: 0.70
  lr_decay: 0.25
  checkpoint_every: 1000
  eval_every: 500
  n_eval_episodes: 1000
  checkpoint_dir: /mnt/checkpoints/
  log_every: 50
  device: cuda

tasks:
  threshold_beater_score: 250

clearml:
  project_name: yahtzee-standalone-a2c
  task_name: 5700X-A6000
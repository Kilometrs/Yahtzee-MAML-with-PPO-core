env:
  n_columns: 6
  seed: 42
  max_steps_per_episode: 250

agent:
  hidden_dim: 256
  n_layers: 3

ppo:
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  gae_lambda: 0.95

meta:
  inner_lr: 0.001
  outer_lr: 0.0003
  n_inner_steps: 5
  n_tasks_per_batch: 5
  n_meta_steps: 50000
  n_parallel_envs: 50

tasks:
  threshold_beater_score: 250

training:
  checkpoint_every: 500
  checkpoint_dir: /mnt/checkpoints/

clearml:
  project_name: yahtzee-maml-server
  task_name: server-run

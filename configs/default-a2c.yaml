env:
  n_columns: 3
  seed: 42

agent:
  hidden_dim: 128
  n_layers: 2

a2c:
  entropy_coef: 0.01
  value_loss_coef: 0.5
  gae_lambda: 0.0

meta:
  inner_lr: 0.01
  outer_lr: 0.0003
  n_inner_steps: 1
  n_tasks_per_batch: 3
  n_meta_steps: 10000
  n_workers: 1

tasks:
  threshold_beater_score: 250

training:
  checkpoint_every: 500
  checkpoint_dir: /mnt/checkpoints/
  device: cuda

clearml:
  project_name: yahtzee-maml-default-a2c
  task_name:

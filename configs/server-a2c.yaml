env:
  n_columns: 6
  seed: 42
  max_steps_per_episode: 234

agent:
  hidden_dim: 600
  n_layers: 2
  use_layer_norm: true
  activation: swish
  dropout_rate: 0.1
  head_hidden_dim: 600

a2c:
  entropy_coef: 0.03
  value_loss_coef: 0.25
  gae_lambda: 0.0
  gamma: 1.0

meta:
  inner_lr: 0.0007
  outer_lr: 0.0001
  n_inner_steps: 3
  n_tasks_per_batch: 6
  n_meta_steps: 100000
  n_parallel_envs: 50

tasks:
  threshold_beater_score: 1400

training:
  checkpoint_every: 500
  eval_every: 2500
  n_eval_episodes: 200
  checkpoint_dir: /mnt/checkpoints/

clearml:
  project_name: yahtzee-maml-server-a2c
  task_name: server-5700X-A6000

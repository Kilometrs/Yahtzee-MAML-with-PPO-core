env:
  n_columns: 1
  seed: 42
  max_steps_per_episode: 50

agent:
  hidden_dim: 128
  n_layers: 2

a2c:
  entropy_coef: 0.01
  value_loss_coef: 0.5
  gae_lambda: 0.0   # TD(0) — paper finding
  gamma: 1.0         # No discounting — maximize total score

meta:
  inner_lr: 0.001
  outer_lr: 0.0003
  n_inner_steps: 1
  n_tasks_per_batch: 6
  n_meta_steps: 100000
  n_parallel_envs: 50

tasks:
  # For 1 column, decent play ~230.
  threshold_beater_score: 200

training:
  checkpoint_every: 500
  eval_every: 1000
  n_eval_episodes: 200
  checkpoint_dir: /mnt/checkpoints-1col/

clearml:
  project_name: yahtzee-maml-server-1col-a2c
  task_name: pc-9900X-RTX3060

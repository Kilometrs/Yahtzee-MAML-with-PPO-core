env:
  n_columns: 3
  seed: 42
  max_steps_per_episode: 117   # 3 cols × 13 turns × 3 steps

agent:
  hidden_dim: 64
  n_layers: 1

ppo:
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  gae_lambda: 0.95
  n_epochs: 1
  batch_size: 32

meta:
  inner_lr: 0.01
  outer_lr: 0.0003
  n_inner_steps: 1
  n_tasks_per_batch: 2
  n_meta_steps: 10
  n_parallel_envs: 4

tasks:
  threshold_beater_score: 250

training:
  checkpoint_every: 5
  checkpoint_dir: checkpoints/test/

clearml:
  project_name: yahtzee-maml-test
  task_name: integration-test

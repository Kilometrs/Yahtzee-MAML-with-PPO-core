[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yahtzee-maml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "gymnasium>=0.29.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "clearml>=1.14.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/env",
    "src/agents",
    "src/meta",
    "src/tasks",
    "src/training",
    "src/logging_utils",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

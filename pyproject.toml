[project]
name = "yahtzee-maml"
version = "0.1.0"
description = "Yahtzee FOMAML meta-learning"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]>=0.4.30",
    "jaxlib>=0.4.30",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "chex>=0.1.80",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "clearml>=1.14.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "tqdm>=4.0",
    "tensorboard>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
